<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8590c">
<title>ทริปโอซาก้า 26 ธ.ค. – 2 ม.ค.</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--tx:#2b2a28;--mu:#6b6862;--bd:#eadfd3;--c:#e8590c;--soft:color-mix(in srgb,var(--c) 12%,var(--card))}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#27251f;--tx:#f4f1ea;--mu:#b9b4aa;--bd:#3d3a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;line-height:1.55}
.hero{background:linear-gradient(135deg,#e8590c,#d6336c 55%,#7048e8);color:#fff;padding:22px 16px 56px;text-align:center}
.hero h1{margin:0;font-size:26px;font-weight:600}
.hero p{margin:6px 0 0;opacity:.92;font-size:14px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none}
.wrap{max-width:820px;margin:-36px auto 0;padding:0 12px 40px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 4px;background:var(--bg)}
.tab{flex:0 0 auto;min-width:74px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:6px 10px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.25}
.tab b{display:block;font-size:15px}.tab small{font-size:11px;color:var(--mu)}
.tab.on{background:var(--tc);border-color:var(--tc);color:#fff;transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.tab.on small{color:#fff;opacity:.9}
.head{background:var(--c);color:#fff;border-radius:16px 16px 0 0;padding:14px 16px;margin-top:6px}
.head h2{margin:0;font-size:20px;font-weight:600}.head p{margin:4px 0 0;font-size:14px;opacity:.95}
iframe{display:block;width:100%;height:340px;border:0;background:var(--soft)}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--soft);border-radius:0 0 16px 16px;margin-bottom:12px}
.btn{border:0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;background:var(--c);color:#fff}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.stop{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .15s}
.stop:hover,.stop.on{transform:translateX(3px);background:var(--soft)}
.em{font-size:26px;width:42px;height:42px;display:grid;place-items:center;background:var(--soft);border-radius:12px;flex:0 0 auto}
.si{flex:1;min-width:0}.si b{font-size:15px}.si div{font-size:13px;color:var(--mu)}
.t{font-size:12px;color:var(--c);font-weight:600}
.km{font-size:12px;background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:18px}
.box h3{margin:0 0 8px;font-size:17px}
.ck{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.ck:first-of-type{border-top:0}.ck input{width:20px;height:20px;accent-color:#2f9e44}
.ck.done span{text-decoration:line-through;color:var(--mu)}
</style>
</head>
<body>
<div class="hero">
<h1>🗾 ทริปโอซาก้า</h1>
<p>26 ธ.ค. 2026 – 2 ม.ค. 2027 · 8 วัน 7 คืน</p>
<div class="chips"><span class="chip" id="cd">⏳</span><a class="chip" href="https://maps.app.goo.gl/6PhxP49W5fHrC3WM8" target="_blank" rel="noopener">🏨 Nikko Tsutenkaku</a></div>
</div>
<div class="wrap">
<div class="tabs" id="tabs"></div>
<div id="day"></div>
<div class="box"><h3>🎒 เช็กลิสต์ก่อนไป</h3><div id="ck"></div></div>
</div>
<script>
var HOTEL=[34.6509753,135.5028671],HQ=HOTEL.join(",");
var COL=["#e8590c","#d6336c","#2f9e44","#7048e8","#1c7ed6","#f08c00","#0ca678","#495057"];
var D=[
{d:"26 ธ.ค.",w:"เสาร์",e:"🛬",h:"ถึงโอซาก้า + Shinsekai",n:"ผ่าน ตม. เช็กอิน แล้วเดินเล่นกินของอร่อย",s:[
["14:10","✈️","สนามบิน KIX","34.4320,135.2304","ถึงสนามบิน ซื้อบัตร ICOCA",0],
["17:00","🗼","Shinsekai + Tsutenkaku","34.6525,135.5063","ถนนโอซาก้าเก่า ถ่ายรูปหอคอย",1],
["18:30","🍢","Kushikatsu มื้อเย็น","34.6529,135.5059","เสียบไม้ชุบแป้งทอด อย่าจิ้มซอสซ้ำ",1],
["20:00","📸","Dotonbori ป้าย Glico","34.6689,135.5011","ถ่ายรูปกลางคืน ชิม Takoyaki",1]]},
{d:"27 ธ.ค.",w:"อาทิตย์",e:"🛍️",h:"ช้อปปิ้ง + คาเฟ่",n:"ย่านช้อปเดินเชื่อมกันได้ทั้งวัน",s:[
["10:30","👗","Shinsaibashi-suji","34.6725,135.5014","ทางเดินในร่ม เหมาะกับวันหนาว",1],
["13:30","🧥","Amerikamura","34.6719,135.4988","แฟชั่นวัยรุ่น ร้านมือสอง",1],
["16:00","☕","Orange Street","34.6726,135.4970","ร้านดีไซน์และคาเฟ่",1],
["18:30","🍜","มื้อเย็นแถว Namba","34.6659,135.5013","ราเมนหรือชาบู",1]]},
{d:"28 ธ.ค.",w:"จันทร์",e:"🎋",h:"Arashiyama เกียวโต",n:"ทริปธรรมชาติ ไปโดย JR ประมาณ 1–1.5 ชม. ออกแต่เช้า",s:[
["09:00","🎋","Arashiyama Bamboo Grove","35.0168,135.6713","ไปเช้าก่อนคนเยอะ",1],
["13:00","🌉","Togetsukyo Bridge","35.0094,135.6779","วิวแม่น้ำและภูเขา",1]]},
{d:"29 ธ.ค.",w:"อังคาร",e:"🎢",h:"Universal Studios Japan",n:"เต็มวัน ไปถึงก่อนเปิดสวนสนุก ซื้อตั๋วล่วงหน้า",s:[
["08:30","🎡","Universal Studios Japan","34.6657,135.4323","เล่นเครื่องเล่นสำคัญก่อน",1]]},
{d:"30 ธ.ค.",w:"พุธ",e:"🐠",h:"อควาเรียม + วิวเมือง",n:"เช้าฝั่งอ่าว เย็นขึ้นตึกชมวิว",s:[
["10:00","🐋","Osaka Aquarium Kaiyukan","34.6545,135.4290","จองตั๋วล่วงหน้า",1],
["15:00","🎡","Tempozan Ferris Wheel","34.6555,135.4290","ชิงช้าสวรรค์ ถ้าเปิดให้บริการ",1],
["17:00","🌆","Umeda Sky Building","34.7053,135.4897","ชมวิวพระอาทิตย์ตก",1]]},
{d:"31 ธ.ค.",w:"พฤหัส",e:"🎆",h:"กินช้อปส่งท้ายปี",n:"ร้านปิดเร็ว ทำของสำคัญช่วงบ่ายให้เสร็จ",s:[
["09:00","🦀","Kuromon Market","34.6654,135.5062","เดินชิมอาหารทะเล ไปเช้า",1],
["11:00","🛍️","Shinsaibashi-suji","34.6725,135.5014","ช้อปของที่ยังขาด",1],
["19:00","✨","Dotonbori","34.6689,135.5011","ชมไฟส่งท้ายปี กลับก่อนรถไฟเที่ยวสุดท้าย",1]]},
{d:"1 ม.ค.",w:"ศุกร์",e:"🎍",h:"วันปีใหม่ + วิวเมือง",n:"ผ่อนคลาย ร้านหลายแห่งปิด เช็กเวลาเปิดก่อนไป",s:[
["10:00","🏙️","Abeno Harukas 300","34.6463,135.5133","จุดชมวิว ใกล้โรงแรมที่สุด",1],
["15:00","📷","Shinsekai ถ่ายรูป","34.6525,135.5063","เดินเล่นช่วงเย็น",1]]},
{d:"2 ม.ค.",w:"เสาร์",e:"🛫",h:"กลับไทย",n:"เครื่องออก 09:20 ถึงสนามบินราว 06:20 ควรจองรถล่วงหน้า",s:[
["06:20","✈️","สนามบิน KIX","34.4320,135.2304","เช็กอินและส่งกระเป๋า",1]]}
];
var CK=["ยืนยันวันเช็กอินกับโรงแรม (ใบจองเริ่ม 25 ธ.ค.)","ซื้อตั๋ว USJ","จองตั๋ว Kaiyukan","เช็กเวลาเปิด Harukas 300 และ Umeda Sky","เช็กรถไฟช่วงปีใหม่และรถไป KIX วันที่ 2 ม.ค.","เตรียมบัตร IC และเงินสด","เสื้อกันหนาว ถุงมือ รองเท้าเดินสบาย"];
function km(q){var p=q.split(",").map(Number),r=Math.PI/180,a=(p[0]-HOTEL[0])*r,b=(p[1]-HOTEL[1])*r;
var x=Math.sin(a/2)*Math.sin(a/2)+Math.cos(HOTEL[0]*r)*Math.cos(p[0]*r)*Math.sin(b/2)*Math.sin(b/2);
var k=12742*Math.asin(Math.sqrt(x));return k<10?k.toFixed(1):Math.round(k)}
var tabs=document.getElementById("tabs"),box=document.getElementById("day");
D.forEach(function(d,i){var b=document.createElement("button");b.className="tab";b.style.setProperty("--tc",COL[i]);
b.innerHTML="<span>"+d.e+"</span><b>"+d.d+"</b><small>"+d.w+"</small>";b.onclick=function(){show(i)};tabs.appendChild(b)});
function pts(d){return d.s.filter(function(s){return s[5]}).map(function(s){return s[3]})}
function route(d){return "https://www.google.com/maps?saddr="+HQ+"&daddr="+pts(d).join("+to:")+"&dirflg=r&output=embed"}
function nav(d){var r=pts(d),l=r.pop();return "https://www.google.com/maps/dir/?api=1&origin="+HQ+"&destination="+l+(r.length?"&waypoints="+r.join("%7C"):"")+"&travelmode=transit"}
function show(i,k){var d=D[i];document.documentElement.style.setProperty("--c",COL[i]);
Array.prototype.forEach.call(tabs.children,function(b,j){b.className="tab"+(j===i?" on":"")});
tabs.children[i].scrollIntoView({inline:"center",block:"nearest"});
var h="<div class=\"head\"><h2>"+d.e+" "+d.d+" · "+d.h+"</h2><p>"+d.n+"</p></div>";
h+="<iframe title=\"แผนที่\" loading=\"lazy\" allowfullscreen src=\""+(k==null?route(d):"https://www.google.com/maps?q="+d.s[k][3]+"&z=16&output=embed")+"\"></iframe>";
h+="<div class=\"bar\"><button class=\"btn alt\" onclick=\"show("+i+")\">🗺️ ดูเส้นทางทั้งวัน</button><a class=\"btn\" target=\"_blank\" rel=\"noopener\" href=\""+nav(d)+"\">📍 นำทางด้วย Google Maps</a></div>";
d.s.forEach(function(s,j){h+="<div class=\"stop"+(j===k?" on":"")+"\" onclick=\"show("+i+","+j+")\"><div class=\"em\">"+s[1]+"</div><div class=\"si\"><span class=\"t\">"+s[0]+"</span><br><b>"+s[2]+"</b><div>"+s[4]+"</div></div><span class=\"km\">~"+km(s[3])+" กม.</span></div>"});
box.innerHTML=h}
var ckb=document.getElementById("ck"),st={};try{st=JSON.parse(localStorage.getItem("osaka-ck")||"{}")}catch(e){}
CK.forEach(function(t,i){var l=document.createElement("label");l.className="ck"+(st[i]?" done":"");
l.innerHTML="<input type=\"checkbox\""+(st[i]?" checked":"")+"><span>"+t+"</span>";
l.firstChild.onchange=function(e){st[i]=e.target.checked;l.className="ck"+(st[i]?" done":"");try{localStorage.setItem("osaka-ck",JSON.stringify(st))}catch(x){}};ckb.appendChild(l)});
var now=new Date(),s0=new Date(2026,11,26),e0=new Date(2027,0,3),cd=document.getElementById("cd"),start=0;
if(now<s0)cd.textContent="⏳ อีก "+Math.ceil((s0-now)/864e5)+" วันถึงทริป";
else if(now<e0){start=Math.min(Math.floor((now-s0)/864e5),7);cd.textContent="✨ วันนี้คือวันที่ "+(start+1)+" ของทริป"}
else cd.textContent="🏁 ทริปจบแล้ว";
show(start);
</script>
</body>
</html>
